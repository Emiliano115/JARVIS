name: Build Jarvis for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build onedir package
        shell: pwsh
        run: .\build_release.ps1

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path .\dist\Jarvis -DestinationPath .\Jarvis-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-x64
          path: Jarvis-Windows-x64.zip

      - name: Attach ZIP to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Jarvis-Windows-x64.zip
